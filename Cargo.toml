[workspace]
resolver = "2"
members = [
    "crates/xcore",
    "crates/render",
    "crates/sim",
    "crates/net",
    "crates/data",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/coconutbird/openensemble"

[workspace.dependencies]
# Internal crates
xcore = { path = "crates/xcore" }
render = { path = "crates/render" }
sim = { path = "crates/sim" }
net = { path = "crates/net" }
data = { path = "crates/data" }

# Windowing and Graphics (pure Rust)
winit = "0.30"
wgpu = "24.0"
pollster = "0.4"  # For blocking on async wgpu calls

# Immediate mode GUI
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"

# Audio (pure Rust)
rodio = "0.20"

# Math and linear algebra
glam = "0.29"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Binary parsing (useful for game formats)
byteorder = "1.5"
binrw = "0.14"
bytemuck = { version = "1.19", features = ["derive"] }

# XML parsing
quick-xml = "0.37"

[package]
name = "openensemble"
version.workspace = true
edition.workspace = true

[dependencies]
xcore = { workspace = true }
render = { workspace = true }
sim = { workspace = true }
net = { workspace = true }
data = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
glam = { workspace = true }
egui = { workspace = true }
bytemuck = { workspace = true }
dotenvy = "0.15"
png = "0.17"

[[bin]]
name = "openensemble"
path = "src/main.rs"

[[bin]]
name = "headless"
path = "src/bin/headless.rs"

[[bin]]
name = "terrain_viewer"
path = "src/bin/terrain_viewer/main.rs"

[dev-dependencies]
