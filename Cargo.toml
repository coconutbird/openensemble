[workspace]
resolver = "2"
members = [
    "crates/motion",
    "crates/render",
    "crates/sim",
    "crates/net",
    "crates/test-support",
    "crates/render-test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/coconutbird/openensemble"

[workspace.dependencies]
# Internal crates
motion = { path = "crates/motion" }
render = { path = "crates/render" }
sim = { path = "crates/sim" }
test-support = { path = "crates/test-support" }
render-test-support = { path = "crates/render-test-support" }

# ensemble-assets (sibling repo) — single dependency for all game data
pipeline = { path = "../ensemble-assets/crates/pipeline" }
era = { path = "../ensemble-formats/crates/era" }
lgt = { path = "../ensemble-formats/crates/lgt" }

# Windowing and Graphics (pure Rust)
winit = "0.30"
wgpu = "24.0"
pollster = "0.4" # For blocking on async wgpu calls

# Immediate mode GUI
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"

# Math and linear algebra
glam = "0.29"
half = "2.4"
num-traits = "0.2"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Binary parsing (useful for game formats)
byteorder = "1.5"
zerocopy = { version = "0.8", features = ["derive"] }

[patch."https://github.com/coconutbird/ensemble-formats.git"]
bdt = { path = "../ensemble-formats/crates/bdt" }
bdt-serde = { path = "../ensemble-formats/crates/bdt-serde" }
ddx = { path = "../ensemble-formats/crates/ddx" }
era = { path = "../ensemble-formats/crates/era" }
uax = { path = "../ensemble-formats/crates/uax" }
ugx = { path = "../ensemble-formats/crates/ugx" }
xmb = { path = "../ensemble-formats/crates/xmb" }
xsd = { path = "../ensemble-formats/crates/xsd" }
xtd = { path = "../ensemble-formats/crates/xtd" }
xtt = { path = "../ensemble-formats/crates/xtt" }

[package]
name = "openensemble"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
render = { workspace = true }
sim = { workspace = true }
pipeline = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
glam = { workspace = true }
half = { workspace = true }
num-traits = { workspace = true }
egui = { workspace = true }
zerocopy = { workspace = true }
pollster = { workspace = true }
dotenvy = "0.15"
png = "0.17"

[[bin]]
name = "openensemble"
path = "src/main.rs"

[[bin]]
name = "headless"
path = "src/bin/headless.rs"

[[bin]]
name = "terrain_viewer"
path = "src/bin/terrain_viewer/main.rs"

[dev-dependencies]
test-support = { workspace = true }

[workspace.lints.rust]
warnings = { level = "deny", priority = -2 }
unused = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }

# Optimize all dependencies in debug and test builds. This includes the path dependencies from
# `ensemble-formats` and `ensemble-assets`. Without optimization, the DDX, ERA and XMB decoders
# make a debug scenario load take minutes. The dependencies have no debug information, which
# makes their first build faster. Backtraces still show their function names.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev.package.render]
opt-level = 1

[profile.dev.package.motion]
opt-level = 1
