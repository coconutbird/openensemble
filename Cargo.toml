[workspace]
resolver = "2"
members = [
    "crates/xcore",
    "crates/motion",
    "crates/render",
    "crates/sim",
    "crates/net",
    "crates/data",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/coconutbird/openensemble"

[workspace.dependencies]
# Internal crates
xcore = { path = "crates/xcore" }
motion = { path = "crates/motion" }
render = { path = "crates/render" }
sim = { path = "crates/sim" }
net = { path = "crates/net" }
data = { path = "crates/data" }

# ensemble-assets (sibling repo) — single dependency for all game data
pipeline = { path = "../ensemble-assets/crates/pipeline" }
ecf = { path = "../ensemble-formats/crates/ecf" }
era = { path = "../ensemble-formats/crates/era" }

# Windowing and Graphics (pure Rust)
winit = "0.30"
wgpu = "24.0"
pollster = "0.4" # For blocking on async wgpu calls

# Immediate mode GUI
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"

# Audio (pure Rust)
rodio = "0.20"

# Math and linear algebra
glam = "0.29"
half = "2.4"
num-traits = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Binary parsing (useful for game formats)
byteorder = "1.5"
binrw = "0.15"
bytemuck = { version = "1.19", features = ["derive"] }

# XML parsing
quick-xml = "0.37"

[patch."https://github.com/coconutbird/ensemble-formats.git"]
bdt = { path = "../ensemble-formats/crates/bdt" }
bdt-serde = { path = "../ensemble-formats/crates/bdt-serde" }
ddx = { path = "../ensemble-formats/crates/ddx" }
era = { path = "../ensemble-formats/crates/era" }
uax = { path = "../ensemble-formats/crates/uax" }
ugx = { path = "../ensemble-formats/crates/ugx" }
xmb = { path = "../ensemble-formats/crates/xmb" }
xtd = { path = "../ensemble-formats/crates/xtd" }
xtt = { path = "../ensemble-formats/crates/xtt" }

[package]
name = "openensemble"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
xcore = { workspace = true }
render = { workspace = true }
sim = { workspace = true }
net = { workspace = true }
data = { workspace = true }
pipeline = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
glam = { workspace = true }
num-traits = { workspace = true }
egui = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
dotenvy = "0.15"
png = "0.17"

[[bin]]
name = "openensemble"
path = "src/main.rs"

[[bin]]
name = "headless"
path = "src/bin/headless.rs"

[[bin]]
name = "terrain_viewer"
path = "src/bin/terrain_viewer/main.rs"

[dev-dependencies]

[workspace.lints.rust]
warnings = { level = "deny", priority = -2 }
unused = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
